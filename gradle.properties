org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Loom is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Minecraft / Fabric. Check https://fabricmc.net/develop for current values.
minecraft_version=26.2
loader_version=0.19.3
fabric_api_version=0.158.0+26.2

# Loom has no stable release for 26.2 yet, so this tracks the snapshot. It is a
# moving target: a bad snapshot upstream can break the build here with no change
# on our side. Pin it to a release as soon as one exists.
loom_version=1.17-SNAPSHOT

# The Java release the mod is compiled against. Minecraft 26.2 requires 25.
mod_java_version=25

# The Java release the launcher is compiled against. Kept low so the installer
# runs on whatever JRE a player already has, long before they own a JDK 25.
launcher_java_version=17

# Versions the installer will offer. The bundled jar is built against
# minecraft_version above; see docs/COMPATIBILITY.md for how to build others.
supported_minecraft_versions=26.2

# Project
mod_version=1.0.2
maven_group=dev.tiltedlunar
archives_base_name=hunted
